<html>
    <head></head>
    <body>
        <h1>Student Registration form</h1>
        <form>
            <label>full name</label>
            <input type="name" name="name" placeholder><br><br>
            <label>email</label>
            <input type="email" name="email" placeholder><br><br>
            <label>password</label>
            <input type="password" name="password" placeholder><br><br>
            <label>age</label>
            <input type="number" name="age" placeholder=><br><br>
            <label>gender</label>
            <input type="radio" name="gender" value="male" placeholder>male
            <input type="radio" name="gender" value="female" placeholder>female<br><br>
            <label>course</label>
            <select name="course" selcted>
            <option value="select">select</option>
            <option value="data sciences">Data Science</option>
            <option value="cyber security">Cyber Security</option>
            <option value="software engineering">Software Engineering</option>
            <option value="devops">devops</option><br><br>
            <label>skills</label>
            <input type="checkbox" name="skills" value="PYTHON" placeholder>Python
            <input type="checkbox" name="skills" value="JAVA" placeholder>Java
            <input type="checkbox" name="skills" value="CSS" placeholder>CSS<br><br>
            <label>about yourself</label>
            <textarea name="about" placeholder="tell us about yourself"></textarea><br><br>
            <label>register</label>
            <input type="register" value="submit" placeholder><br><br>
            <label>terms and conditions</label>
            <input type="checkbox" name="terms" value="accepted" placeholder>I accept the terms and conditions<br><br>
        </form>
    </body>
</html>
